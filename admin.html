<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aurora Finland</title>
    <link rel="stylesheet" href="bootstrap.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
    </header>
    <main>
        <section id="breadcrumbs" class="col-10 mx-auto my-3"><a href="index.html">首頁</a><span>&nbsp;/&nbsp;極光預報</span>
        </section>
        <section class="col-10 mx-auto my-3">
            <span class="text-danger" id="record"></span>
            <div class="card card-body text-center">
                <form id="search" class="row">
                </form>
            </div>
        </section>
        <article class="col-10 mx-auto my-3 p-2" id="result">
        </article>
    </main>
    <footer class="bg-secondary text-center">
        <p>第 19 屆全國身心障礙者技能競賽 設計者：Web67</p>
    </footer>
</body>

</html>
<script src="jqueryv4.0.0.js"></script>
<script src="bootstrap.js"></script>
<script src="main.js"></script>
<script>
    let result = {}
    function render() {
        if (localStorage.getItem("login") != "true") {
            location.href = "login.html"
        }
        let locations
        let html = ""
        $.post("api.php", {action: "forecast_get"}, function (res) {
            locations = JSON.parse(res)
            window['lang'] = localStorage.getItem("lang") ?? "zh-tw"
            if (window['lang'] == "en") {
                html += `<option value="all">All Locations</option>`
                $("#result").text("if you want to data than you must need some action :)")
                locations.forEach((row) => {
                    html += `<option value="${row['name_en']}">${row['name_en']}</option>`
                });
                $("#breadcrumbs").html(`<a href="index.html">Home</a><span>&nbsp;/&nbsp;Administrator</span>`)
                $("#search").html(`
                <div class="col">
                            <label for="locations">Location</label>
                            <select name="locations" id="locations" class="form-control"></select>
                        </div>
                        <div class="col">
                            <label for="rate">rate</label>
                            <input type="rate" name="rate" id="rate" class="form-control">
                        </div>
                        <div class="col">
                            <label for="order">Sorting Order</label>
                            <select name="order" id="order" class="form-control">
                                <option value="date+asc">date(accessing)</option>
                                <option value="date+desc">date(deccending)</option>
                                <option value="date+asc">rate(accessing)</option>
                                <option value="date+desc">rate(deccending)</option>
                                <option value="bless+asc">Aurora Probability(accessing)</option>
                                <option value="bless+desc">Aurora Probability(deccending)</option>
                            </select>
                        </div>
                        <div class="col">
                            <label for="key">keyword</label>
                            <input class="form-control" name="key" id="key">
                        </div>
                        <div class="col-auto"><button class="btn btn-primary">Search</button></div>
                        `)
                $.post("api.php",{action: "record"},function (res) {
                    $("#record").text(`deleted:${res}`)
                })
            } else {
                $("#result").text("要得名就要行動")
                html += `<option value="all">所有地點</option>`
                locations.forEach((row) => {
                    html += `<option value="${row['name_en']}">${row['name']}</option>`
                });
                $("#search").html(`
                <div class="col">
                            <label for="locations">觀賞地點</label>
                            <select name="locations" id="locations" class="form-control"></select>
                        </div>
                        <div class="col">
                            <label for="rate">篩選評分</label>
                            <input type="rate" name="rate" id="rate" class="form-control">
                        </div>
                        <div class="col">
                            <label for="order">排列順序</label>
                            <select name="order" id="order" class="form-control">
                                <option value="date+asc">觀賞日期(升冪)</option>
                                <option value="date+desc">觀賞日期(降冪)</option>
                                <option value="date+asc">評分數量(升冪)</option>
                                <option value="date+desc">評分數量(降冪)</option>
                                <option value="bless+asc">祝福數量(升冪)</option>
                                <option value="bless+desc">祝福數量(降冪)</option>
                            </select>
                        </div>
                        <div class="col">
                            <label for="key">關鍵字</label>
                            <input class="form-control" name="key" id="key">
                        </div>
                        <div class="col-auto"><button class="btn btn-primary">Search</button></div>
                        `)
                $("#breadcrumbs").html(`<a href="index.html">首頁</a><span>&nbsp;/&nbsp;系統管理</span>`)
                $.post("api.php",{action: "record"},function (res) {
                    $("#record").text(`已刪除:${res}`)
                })
            }
            $("#locations").html(html)
        })
    }
    function card(data) {
        console.log(data);

        let html = "<div class='row row-cols-md-2 row-cols-1'>"
        if (window['lang'] == "en") {
            const COLS = [
                [`name`, "Name", ""],
                [`Email`, "Email", ""],
                [`location`, "Location", ""],
                [`date`, "Date", ""],
                [`rate`, "Rate", ""],
                [`feedback`, "Feedback", ""],
                [`file`, "File", ""],
                [`bless`, "Bless", ""],
                [`updated_at`, "Updated_at", ""],
            ]
            data.forEach((row) => {
                html += `<div class="col p-1"><div class="card card-body">${COLS.map(([key, value, suffix]) => {
                    const val = row[key]
                    if (val == null) return `<p tabindex="0">${value + ":<br>" + empty()}</p>`
                    if (key == "file") return `<img alt="${val}" src="${val}" tabindex="0">`
                    if (key == "Email") return `<p tabindex="0" class="text-primary" style="cursor:pointer;"
                        onclick="email('${val}')" tabindex="0">${value + ":<br>" + val.split("@")[0][0]}###@${val.split("@")[1]}</p>`
                    else return `<p>${value + ":<br>" + val + suffix}</p>`
                }).join("")}
                    <button class="btn btn-danger bless" data-id="${row['id']}">delete</button>
                    </div></div>`
            })
        } else {
            const COLS = [
                [`name`, "旅人暱稱", ""],
                [`Email`, "Email", ""],
                [`location`, "觀賞地點", ""],
                [`date`, "觀賞日期", ""],
                [`rate`, "極光評分", ""],
                [`feedback`, "觀賞心得", ""],
                [`file`, "照片", ""],
                [`bless`, "祝福數量", ""],
                [`updated_at`, "更新時間", ""],
            ]
            data.forEach((row) => {
                html += `<div class="col p-1"><div class="card card-body">${COLS.map(([key, value, suffix]) => {
                    const val = row[key]
                    if (val == null) return `<p tabindex="0">${value + ":<br>" + empty()}</p>`
                    if (key == "file") return `<img alt="${val}" src="${val}" tabindex="0">`
                    if (key == "Email") return `<p tabindex="0" class="text-primary" style="cursor:pointer;"
                        onclick="email('${val}')" tabindex="0">${value + ":<br>" + val.split("@")[0][0]}###@${val.split("@")[1]}</p>`
                    else return `<p tabindex="0">${value + ":<br>" + val + suffix}</p>`
                }).join("")}
                    <button class="btn btn-danger bless" data-id="${row['id']}">刪除</button>
                    </div></div>`
            })
        }
        html += `</table>`
        $("#result").html(html)
    }
    $("#open").on("click", function (e) {
        e.preventDefault()
        $("#form").modal("show")
    })
    $(document).on("click", ".bless", function () {
        $(this).prop("disabled", true)
        const id = $(this).data("id")
        $.post("api.php", {action: "del", id: id}, (res) => {
            alert("已刪除")
        })
    })
    function email(val) {
        result = result.filter((row) => row.Email == val)
        card(result)
    }
    render()
    $("#search").on("submit", function (e) {
        e.preventDefault()
        $.post("api.php", {action: "journal_get"}, function (res) {
            result = JSON.parse(res)
            const order = $("#order").val()
            const locations = $("#locations").val()
            const key = $("#key").val()
            const rate = $("#rate").val()

            if (locations != "all") result = result.filter((row) => row.location == locations)
            if (rate != "") result = result.filter((row) => row.rate == rate)
            if (key != "") result = result.filter((row) => row['feedback'].includes(key))
            result = sorting(order, result)
            card(result)
        })

    })
</script>
